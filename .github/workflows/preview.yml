name: Shells preview APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vizo/**'
      - 'mate/**'
      - 'integration/**'
      - 'settings.gradle.kts'
      - '.github/workflows/preview.yml'

permissions:
  contents: read

concurrency:
  group: shells-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [mobile, tv]
    steps:
      - uses: actions/checkout@v4
        with:
          path: yai-player-shells
      - uses: actions/checkout@v4
        with:
          repository: eai-apps/YAiPlayer
          ref: 12e6f959002244ec7b38b896a3a191e425ec6b58
          path: YAiPlayer
          persist-credentials: false
      - name: Apply the local preview integration
        run: git -C YAiPlayer apply ../yai-player-shells/integration/YAiPlayer-Shells.patch
      - uses: actions/setup-java@v4
        if: matrix.platform == 'mobile'
        id: launcher_jdk
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Bundle the existing TV optimizer launcher
        if: matrix.platform == 'mobile'
        working-directory: YAiPlayer/clients/tv-launcher
        env:
          JAVA_HOME: ${{ steps.launcher_jdk.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          install -D app/build/outputs/apk/release/app-release.apk ../android-mobile/app/src/main/assets/tvoptimizer/launcher.apk
      - name: Build and sign the Shells APK
        working-directory: YAiPlayer/clients/android-${{ matrix.platform }}
        env:
          SHELLS_SIGNING_BUNDLE: ${{ secrets.SHELLS_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          export KEYSTORE_FILE="$RUNNER_TEMP/yai-shells.p12"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          test -n "$SHELLS_SIGNING_BUNDLE"
          umask 077
          jq -er '.keystore' <<< "$SHELLS_SIGNING_BUNDLE" | base64 --decode > "$KEYSTORE_FILE"
          KEYSTORE_PASSWORD="$(jq -er '.password' <<< "$SHELLS_SIGNING_BUNDLE")"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD KEY_PASSWORD="$KEYSTORE_PASSWORD" KEY_ALIAS=yai-shells
          unset SHELLS_SIGNING_BUNDLE
          attempt=$((10#$GITHUB_RUN_ATTEMPT))
          test "$attempt" -lt 100
          export VERSION_CODE=$((10#$GITHUB_RUN_NUMBER * 100 + attempt))
          export VERSION_NAME="0.2.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease -Pshells.updates=true -Powntv.corePath="$GITHUB_WORKSPACE/YAiPlayer/clients/owntv-core" --max-workers=4 --no-daemon --stacktrace
      - name: Test TV guide row focus
        if: matrix.platform == 'tv'
        working-directory: YAiPlayer/clients/android-tv
        run: ./gradlew :app:testStandardDebugUnitTest --tests tv.own.owntv.features.epg.GuideRowFocusArgsTest -Powntv.corePath="$GITHUB_WORKSPACE/YAiPlayer/clients/owntv-core" --max-workers=4 --no-daemon
      - name: Verify package, signature and shell classes
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mapfile -t files < <(find "YAiPlayer/clients/android-$TARGET_PLATFORM/app/build/outputs/apk/standard/release" -maxdepth 1 -name '*.apk')
          test "${#files[@]}" -eq 1
          mkdir -p dist
          apk="dist/YAiPlayer-Shells-$TARGET_PLATFORM.apk"
          cp "${files[0]}" "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > certificate.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: $(cat yai-player-shells/integration/signing-cert.sha256)" certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > badging.txt
          grep -F "package: name='com.yai.iptv.player.$TARGET_PLATFORM.shells' versionCode='$((10#$GITHUB_RUN_NUMBER * 100 + 10#$GITHUB_RUN_ATTEMPT))' versionName='0.2.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT'" badging.txt
          grep -F 'android.permission.REQUEST_INSTALL_PACKAGES' badging.txt
          python3 yai-player-shells/integration/verify_apk.py "$apk" "$TARGET_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: shells-${{ matrix.platform }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: yai-player-shells
      - uses: actions/checkout@v4
        with:
          repository: eai-apps/YAiPlayer
          ref: 12e6f959002244ec7b38b896a3a191e425ec6b58
          path: YAiPlayer
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: shells-*
          merge-multiple: true
          path: dist
      - name: Package corresponding source
        run: |
          git -C YAiPlayer apply ../yai-player-shells/integration/YAiPlayer-Shells.patch
          git -C YAiPlayer add -A
          mkdir -p source/YAiPlayer source/yai-player-shells
          git -C YAiPlayer archive "$(git -C YAiPlayer write-tree)" | tar -x -C source/YAiPlayer
          git -C yai-player-shells archive HEAD | tar -x -C source/yai-player-shells
          cp yai-player-shells/integration/README.md source/README.md
          cp yai-player-shells/integration/COPYING source/COPYING
          tar -C source -czf dist/YAiPlayer-Shells-corresponding-source.tar.gz .
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)
      - name: Publish the Shells update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          published="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          python3 - "$tag" "$published" <<'PY'
          import sys
          def version(tag):
              return tuple(map(int, tag.removeprefix("v").split(".")))
          tag, published = sys.argv[1:]
          if published and version(tag) <= version(published):
              raise SystemExit("Refusing to publish a version older than or equal to the current Shells release")
          PY
          cat > notes.md <<'EOF'
          YAiPlayer Shells для телефона и ТВ. Обновления проверяются при запуске и в настройках приложения.
          Исправлен возврат фокуса пульта в телегид Mate после просмотра и вход на строку канала после прокрутки.
          При переходе со старых тестовых APK shells-preview потребуется переустановка тестового приложения.
          EOF
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "YAiPlayer Shells ${tag#v}" --notes-file notes.md
